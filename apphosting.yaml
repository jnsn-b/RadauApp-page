# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
domains:
  - domainName: www.radau.app
    type: redirect
redirects:
  - type: 301
    # This regex matches any path on the www domain. The backtick in the
    # destination will append it to the new URL.
    regex: "^/.*"
    # This header rule scopes the redirect to ONLY apply to www.radau.app.
    headers:
      - header: Host
        regex: "^www\\.radau\\.app$"
    # The destination uses the backtick to append the original request path.
    destination: "https://radau.app`"
